name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'NLU-Wayfinder-Campus.html'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: android-app
        run: npm install

      - name: Prepare web assets (offline artifact)
        working-directory: android-app
        run: node prepare.mjs

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Patch AndroidManifest (location permissions)
        working-directory: android-app
        run: node patch-manifest.mjs

      - name: Setup ký số (nếu có KEYSTORE_BASE64 secret)
        working-directory: android-app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            node patch-signing.mjs
            echo "SIGN=1" >> "$GITHUB_ENV"
            echo ">> Có keystore -> build RELEASE (đã ký)."
          else
            echo "SIGN=0" >> "$GITHUB_ENV"
            echo ">> Chưa có keystore secret -> build DEBUG."
          fi

      - name: Build RELEASE APK (đã ký)
        if: env.SIGN == '1'
        working-directory: android-app/android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../NLU-Wayfinder.apk

      - name: Build DEBUG APK (khi chưa có keystore)
        if: env.SIGN == '0'
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../NLU-Wayfinder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NLU-Wayfinder-apk
          path: NLU-Wayfinder.apk
          if-no-files-found: error

      - name: Publish to Release (chỉ khi bấm chạy thủ công)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: NLU Wayfinder APK (bản mới nhất)
          files: NLU-Wayfinder.apk
          body: |
            APK tự động build từ bản artifact offline (release đã ký nếu cấu hình keystore, ngược lại là debug).
            Cài trên Android: bật "Cài từ nguồn không xác định" rồi mở file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
